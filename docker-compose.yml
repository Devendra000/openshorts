services:
  backend:
    build:
      context: .
      args:
        # WhisperX in its own venv inside the image (TRANSCRIBE_BACKEND=whisperx).
        WHISPERX: "1"
    container_name: openshorts-backend
    network_mode: host
    # Local box: CPU WhisperX would otherwise take every core.
    cpus: "6"
    environment:
      - PORT=8008
      - TRANSCRIBE_BACKEND=whisperx
      - WHISPERX_BIN=/opt/whisperx/bin/whisperx
      - WHISPERX_CACHE_DIR=/opt/whisperx-cache
      - WHISPERX_MODEL=small
      - WHISPERX_DEVICE=cpu
      - WHISPERX_COMPUTE_TYPE=int8
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      - whisperx-models:/opt/whisperx-cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$${PORT:-8000}/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 2
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    network_mode: host
    command: ["npm", "run", "dev", "--", "--host", "--port", "5175"]
    environment:
      - VITE_PROXY_TARGET=http://127.0.0.1:8008
      - VITE_RENDER_TARGET=http://127.0.0.1:3100
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    network_mode: host
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    volumes:
      - ./output:/output
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  whisperx-models:
